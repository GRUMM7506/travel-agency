name: Build Android APK (manual)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Адрес backend API (например https://xxxx.trycloudflare.com)"
        required: false
        default: ""

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build APK
        run: |
          API_URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="${{ vars.API_BASE_URL }}"
          fi
          echo "Using API_BASE_URL=$API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-agency-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
